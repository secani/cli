# Publishes the CLI to npm when a version tag (v0.1.0) is pushed to the
# public secani/cli repository, with a provenance statement that links the
# package to this commit. Authenticates with npm trusted publishing (OIDC);
# an NPM_TOKEN secret is used instead while trusted publishing isn't set up,
# which is needed for the very first publish of the package.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or newer.
      - run: npm install --global npm@11.21.1
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p 'require("./package.json").version')"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json ($version)." >&2
            exit 1
          fi
      - run: npm install --no-audit --no-fund
      - run: npm run verify
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
